# yaml-language-server: $schema=https://mise.jdx.dev/schema/mise.json
min_version = "2026.7.0"

[settings]
always_keep_download = false
legacy_version_file = false

[tools]
"go" = "1.27.3"
"aqua:caarlos0/svu" = "3.4.1"
"aqua:crate-ci/typos" = "1.51.1"
"aqua:golangci/golangci-lint" = "2.15.0"
"aqua:goreleaser/goreleaser" = "2.18.3"
"aqua:go-task/task" = "3.54.0"
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:tamasfe/taplo" = "0.10.0"
"aqua:golang-migrate/migrate" = "4.20.1"
"aqua:sqlc-dev/sqlc" = "1.31.1"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"
"go:github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen" = "2.8.0"
"npm:markdownlint-cli2" = "0.24.0"
"npm:renovate" = { version = "44.178.0", trust_policy_excludes = ["@yarnpkg/libzip@3.2.2"] }
"npm:squawk-cli" = "2.70.0"
"npm:@redocly/cli" = "2.69.0"
"pipx:reuse" = "6.2.0"
"pipx:yamllint" = "1.38.0"
"pipx:sqlfluff" = "4.4.0"

# indirect
"node" = "24.22.1"
"pipx" = "1.18.4"
"python" = "3.15.1"
"aqua:koalaman/shellcheck" = "0.11.0"

[env]
_.file = ".env"
