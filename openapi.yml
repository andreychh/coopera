# yamllint disable rule:empty-lines
openapi: 3.0.0

info:
  title: Coopera API
  version: 0.0.1
  description: >
    Coopera is a routine task tracker for teams. The system records events (who did what and
    when) and does not resolve conflicts within a team.

servers:
  - url: http://localhost:8080/v1
    description: Local development

tags:
  - name: auth
    description: Signing in
  - name: users
    description: People
  - name: teams
    description: Teams
  - name: invite-links
    description: Invite links

paths:
  /auth/codes:
    post:
      operationId: createCode
      tags: [ auth ]
      summary: Request a sign-in code
      description: >
        Sends a one-time code to the given address. The answer is the same whether or not an
        account already exists behind that address: telling the two apart would turn this into a
        directory of registered people. The code travels by mail only and is never part of any
        response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCodeRequest'

      responses:
        '202':
          description: >
            The code was sent. Nothing here says whether an account exists, and nothing here
            promises the mail arrived — delivery is the only real test, and its outcome belongs to
            the mailbox, not to this answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeDelivery'

        '400':
          description: >
            The address is not shaped like an email address. Only its form is checked here: whether
            mail can actually reach it is not knowable without sending, and the result of sending
            is deliberately not reported.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '429':
          description: >
            Too many codes requested for this address. Without this limit the endpoint becomes a
            way to mail anyone repeatedly: the system does the sending, and someone who never asked
            does the receiving.
          headers:
            Retry-After:
              description: Seconds to wait before requesting another code
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '500':
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /auth/sessions:
    post:
      operationId: createSession
      tags: [ auth ]
      summary: Sign in with a code
      description: >
        Exchanges an emailed code for a pass. The account comes into being here if the address had
        none: signing in and signing up are one act, because separating them would mean saying
        whether the address is known, and that is what this API refuses to say. The code is checked
        together with the address it was issued for — six digits are not unique, and alone they
        identify nobody.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'

      responses:
        '201':
          description: >
            Signed in. The answer does not say whether the account was born just now: that is a
            state, not an event, and it is read from the person, not from this moment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pass'

        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '401':
          description: >
            The code does not match the one issued for this address. The code survives this: the
            answer says how many attempts it has left before being burned.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/InvalidCodeProblem'

        '410':
          description: >
            No live code stands behind this address. It may have expired, been spent, been burned by
            failed attempts, or been replaced by a newer one — all four call for the same thing, a
            fresh code, so they are not told apart.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '500':
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /auth/sessions/current:
    delete:
      operationId: deleteSession
      tags: [ auth ]
      summary: Sign out
      description: >
        Ends the session the presented token belongs to, on this device only — the other devices a
        person is signed in on know nothing of it. The refresh token dies with the session, so
        nothing can be renewed. The access token is not recalled and keeps working until it expires:
        for those few minutes the pass outlives what it opens. Signing out twice is not an error —
        the second attempt finds nothing left to end and answers the same way.
      security:
        - bearerAuth: [ ]
      responses:
        '204':
          description: Signed out

        '401':
          description: >
            The access token is not accepted, so there is no session to speak of.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '500':
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /auth/sessions/current/refresh:
    post:
      operationId: refreshSession
      tags: [ auth ]
      summary: Trade the refresh token for a fresh pass
      description: >
        Issues new keys for the session the presented token belongs to. The session itself is not
        replaced: it lasts from signing in until signing out, and these are only its keys. The token
        presented here is spent in the act — a second use of the same one means a copy is loose, and
        then the session ends for everyone holding it, the rightful owner included.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshSessionRequest'

      responses:
        '200':
          description: Fresh pass issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pass'

        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '401':
          description: >
            The token is not accepted. Unknown, expired, revoked by signing out, or already spent —
            all four are answered alike, because the holder can do only one thing about any of them,
            sign in again, and because telling them apart would help whoever holds a stolen copy.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '500':
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /users/me:
    get:
      operationId: getMe
      tags: [ users ]
      summary: Get the caller
      description: >
        Who the caller is and whether they have named themselves yet. The state is read from here
        rather than inferred elsewhere: it outlives any single moment, and someone who closed the
        app on the naming screen still has to be asked again.
      parameters:
        - $ref: '#/components/parameters/XUserId'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '401':
          description: The caller could not be identified
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '500':
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /users/me/introduction:
    post:
      operationId: createIntroduction
      tags: [ users ]
      summary: Introduce yourself
      description: >
        Names the person for the first time. Until this happens almost everything is closed to them:
        a name is what others see, and until there is one there is nothing to show. Doing it twice
        is not a malformed request but a sign that it is long done — hence 409 rather than 400.
      parameters:
        - $ref: '#/components/parameters/XUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIntroductionRequest'

      responses:
        '201':
          description: Introduced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '401':
          description: The caller could not be identified
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '409':
          description: >
            Either this person already has a name, or the name asked for belongs to someone else.
            Both are conflicts with a state that exists rather than malformed requests, so both
            answer alike — until problem types arrive, the wording in `detail` is what tells them
            apart.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '500':
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /teams:
    post:
      operationId: createTeam
      tags: [ teams ]
      summary: Create a team
      description: >
        Creates a team and makes the caller its owner. The caller must have introduced themselves
        first: a team has members, members are shown to one another, and someone without a name has
        nothing to show.
      parameters:
        - $ref: '#/components/parameters/XUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTeamRequest'

      responses:
        '201':
          description: Team created
          headers:
            Location:
              description: URL of the created team
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'

        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '401':
          description: The caller could not be identified
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '403':
          description: >
            The caller has not introduced themselves yet, and until they do there is nothing to show
            the team about them.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '500':
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /teams/{id}:
    get:
      operationId: getTeam
      tags: [ teams ]
      summary: Get a team
      description: >
        Returns a team by its id.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/XUserId'
      responses:
        '200':
          description: Team found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'

        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '403':
          description: >
            The caller has not introduced themselves yet. This is decided before the team is looked
            up, so it says nothing about whether the team exists.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '404':
          description: Team not found, or the caller is not a member
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '500':
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /users/me/teams:
    get:
      operationId: listMyTeams
      tags: [ teams ]
      summary: List the caller's teams
      description: >
        Returns teams where the caller has an active membership, whatever their role in it, most
        recently joined first. A team left is a team gone from this list. Having no teams is not a
        failure but an ordinary state, and answers with an empty list.
      parameters:
        - $ref: '#/components/parameters/XUserId'
      responses:
        '200':
          description: Caller's teams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Team'

        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '403':
          description: >
            The caller has not introduced themselves yet. Their list would be empty in any case —
            a nameless person cannot have joined anything — but the answer is a refusal rather than
            an empty list, so that one rule guards every door alike.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '500':
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /teams/{team_id}/invite-links:
    post:
      operationId: createInviteLink
      tags: [ invite-links ]
      summary: Create an invite link
      description: >
        Creates a link that can be used to join the team. Only the team's owner may create one.
      parameters:
        - name: team_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/XUserId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInviteLinkRequest'
      responses:
        '201':
          description: Invite link created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteLink'

        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '403':
          description: >
            The caller may not create invite links for this team. Whether the team does not exist,
            the caller does not belong to it, or belongs to it without owning it is deliberately
            not distinguished, so that someone outside a team cannot learn that it exists. Do not
            read this answer as proof that the team is real. A caller who has not introduced
            themselves is refused here too, before any of the above is looked at.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '500':
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

    get:
      operationId: listInviteLinks
      tags: [ invite-links ]
      summary: List the team's invite links
      description: >
        Returns invite links for the team, optionally filtered by status. Only the team's owner
        may list them.
      parameters:
        - name: team_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ active, expired, revoked ]
        - $ref: '#/components/parameters/XUserId'
      responses:
        '200':
          description: Invite links
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InviteLink'

        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '403':
          description: >
            The caller may not see this team's invite links. Whether the team does not exist, the
            caller does not belong to it, or belongs to it without owning it is deliberately not
            distinguished, so that someone outside a team cannot learn that it exists. Do not read
            this answer as proof that the team is real. An owner whose team has no invite links
            gets an empty list, not this. A caller who has not introduced themselves is refused
            here too, before any of the above is looked at.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '500':
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /invite-links/{code}:
    delete:
      operationId: revokeInviteLink
      tags: [ invite-links ]
      summary: Revoke an invite link
      description: >
        Marks the invite link as revoked. Only the owner of the team it belongs to may revoke it.
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/XUserId'
      responses:
        '204':
          description: Invite link revoked

        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '403':
          description: >
            The caller is not the owner of the link's team, or has not introduced themselves at
            all — the latter is decided first, before the link is looked up.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '404':
          description: Invite link not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '409':
          description: The invite link is already revoked
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '500':
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /invite-links/{code}/acceptances:
    post:
      operationId: acceptInviteLink
      tags: [ invite-links ]
      summary: Join a team via an invite link
      description: >
        Adds the caller as a member of the team the invite link belongs to. Accepting is
        idempotent: someone who is already a member is asking for something that already holds,
        so the call succeeds and changes nothing. The caller must have introduced themselves
        first — a team sees its members by name.
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/XUserId'
      responses:
        '200':
          description: >
            Already a member of the team, so nothing changed. The link's use count was not
            raised, because it counts people who joined rather than times it was opened.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'

        '201':
          description: Joined the team
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'

        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '401':
          description: The caller could not be identified
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '403':
          description: >
            The caller has not introduced themselves yet, and until they do there is nothing to show
            the team about them.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '404':
          description: Invite link not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '410':
          description: >
            The invite link no longer works. Whether it was revoked or simply expired is not
            distinguished: either way a fresh invitation is needed, and which of the two it was
            is the team owner's to explain, not this API's.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '500':
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        The access token from a pass, sent as `Authorization: Bearer <token>`. Never a cookie: a
        header has to be set deliberately, so a page on another site cannot make the browser send
        one, and a whole class of forged requests stops existing.

  parameters:
    XUserId:
      name: X-User-Id
      in: header
      required: true
      description: >
        Temporary placeholder until real authentication exists. Identifies the caller.
      schema:
        type: string
        format: uuid

  schemas:
    CreateCodeRequest:
      type: object
      properties:
        email:
          $ref: "#/components/schemas/Email"
      required: [ email ]

    CodeDelivery:
      description: >
        Says that a code was sent. It carries neither the code nor the address on purpose: the code
        belongs in the mailbox, and the address is what the caller has just supplied.
      type: object
      properties:
        expires_in:
          type: integer
          description: Seconds the code just sent will keep working.
        retry_after:
          type: integer
          description: Seconds before another code may be requested for this address.
      required: [ expires_in, retry_after ]

    Email:
      type: string
      format: email
      maxLength: 254

    CreateSessionRequest:
      type: object
      properties:
        email:
          $ref: "#/components/schemas/Email"
        code:
          $ref: "#/components/schemas/Code"
      required: [ email, code ]

    Code:
      type: string
      pattern: '^[0-9]{6}$'

    Pass:
      description: >
        The keys to a session, not the session itself. The access token is short-lived and travels
        in Authorization on every request. The refresh token is long-lived and buys a fresh pair
        once the access token dies; it is the one worth stealing, and belongs where scripts cannot
        reach it.

        Both lifetimes are counted from the moment this answer arrives rather than named as
        instants. Their holder acts on them, and naming an instant would send it to its own clock —
        the one thing here not worth trusting. A phone kept off the network drifts by minutes, and
        an access token lives fifteen.
      type: object
      properties:
        access_token:
          type: string
        access_expires_in:
          type: integer
          description: Seconds the access token will be accepted for.
        refresh_token:
          type: string
        refresh_expires_in:
          type: integer
          description: >
            Seconds the refresh token will be accepted for. Starts over with every refresh: a
            session dies from disuse, not from age.
      required: [ access_token, access_expires_in, refresh_token, refresh_expires_in ]

    RefreshSessionRequest:
      type: object
      properties:
        refresh_token:
          type: string
      required: [ refresh_token ]
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        state:
          $ref: '#/components/schemas/UserState'
      required: [ id, created_at, state ]

    UserState:
      oneOf:
        - $ref: '#/components/schemas/UnintroducedUserState'
        - $ref: '#/components/schemas/IntroducedUserState'
      discriminator:
        propertyName: status
        mapping:
          unintroduced: '#/components/schemas/UnintroducedUserState'
          introduced: '#/components/schemas/IntroducedUserState'

    UnintroducedUserState:
      description: >
        The person exists and nothing else about them is known yet. Carries no name — not an empty
        one, none at all, so that "introduced without a name" cannot be said.
      type: object
      properties:
        status:
          type: string
          enum: [ unintroduced ]
      required: [ status ]

    IntroducedUserState:
      type: object
      properties:
        status:
          type: string
          enum: [ introduced ]
        username:
          $ref: "#/components/schemas/Username"
      required: [ status, username ]

    Username:
      description: >
        Lowercase letters, digits and underscores, 3 to 32 of them, never starting, ending or
        doubling on the underscore. The alphabet is narrow on purpose: a name that identifies can be
        impersonated by one that merely resembles it, and within a single script no two characters
        resemble each other closely enough. Capitals are refused rather than folded, so that one
        person has one spelling.
      type: string
      minLength: 3
      maxLength: 32
      pattern: '^[a-z0-9]([a-z0-9]|_[a-z0-9])*$'

    CreateIntroductionRequest:
      type: object
      properties:
        username:
          $ref: "#/components/schemas/Username"
      required: [ username ]

    Team:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          $ref: "#/components/schemas/TeamName"
        created_at:
          type: string
          format: date-time
      required: [ id, name, created_at ]

    CreateTeamRequest:
      type: object
      properties:
        name:
          $ref: "#/components/schemas/TeamName"
      required: [ name ]

    TeamName:
      type: string
      minLength: 1
      maxLength: 100

    CreateInviteLinkRequest:
      type: object
      properties:
        expires_at:
          type: string
          format: date-time
      description: >
        Omitting expires_at creates a link that never expires.

    InviteLink:
      type: object
      properties:
        code:
          type: string
        use_count:
          type: integer
        created_at:
          type: string
          format: date-time
        state:
          $ref: '#/components/schemas/InviteLinkState'
      required: [ code, use_count, created_at, state ]

    InviteLinkState:
      oneOf:
        - $ref: '#/components/schemas/ActiveInviteLinkState'
        - $ref: '#/components/schemas/ExpiredInviteLinkState'
        - $ref: '#/components/schemas/RevokedInviteLinkState'
      discriminator:
        propertyName: status
        mapping:
          active: '#/components/schemas/ActiveInviteLinkState'
          expired: '#/components/schemas/ExpiredInviteLinkState'
          revoked: '#/components/schemas/RevokedInviteLinkState'

    ActiveInviteLinkState:
      type: object
      properties:
        status:
          type: string
          enum: [ active ]
        expires_at:
          type: string
          format: date-time
          nullable: true
      required: [ status, expires_at ]

    ExpiredInviteLinkState:
      type: object
      properties:
        status:
          type: string
          enum: [ expired ]
        expired_at:
          type: string
          format: date-time
      required: [ status, expired_at ]

    RevokedInviteLinkState:
      type: object
      properties:
        status:
          type: string
          enum: [ revoked ]
        revoked_at:
          type: string
          format: date-time
      required: [ status, revoked_at ]

    Problem:
      description: >
        RFC 9457 Problem Details for HTTP APIs.
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri
      required: [ title, status ]

    InvalidCodeProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            attempts_left:
              type: integer
          required: [ attempts_left ]
